name: vitacoach
description: "VitaCoach - cevrimdisi calisan kisisel saglik kocu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  provider: ^6.1.5+1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  http: ^1.6.0
  url_launcher: ^6.3.1
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.5
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  geolocator: ^14.1.1
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  # Kaynak katmanlar: assets/images/icon_src (uygulamaya paketlenmez).
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_src/icon_ios.png"
  image_path_android: "assets/images/icon_src/icon_round.png"
  image_path_ios: "assets/images/icon_src/icon_ios.png"
  remove_alpha_ios: true
  # Android 8+ uyarlanabilir simge: başlatıcı yuvarlak maskeyi kendisi uygular.
  adaptive_icon_background: "assets/images/icon_src/icon_background.png"
  adaptive_icon_foreground: "assets/images/icon_src/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/fonts/

  # Uygulama yazı tipi uygulamayla birlikte gelir; çalışma anında
  # internetten yazı tipi indirilmez.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

dependency_overrides:
  # geolocator_linux -> package_info_plus 10.2.x, AGP 9 + builtInKotlin=false
  # yapılandırmasında Kotlin eklentisini uygulamadığı için derleme kırılıyor.
  package_info_plus: 10.0.0
